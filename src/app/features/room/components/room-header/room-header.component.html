<header class="bar">
  <div class="bar__inner">
    <app-logo />
    <span class="bar__rule" aria-hidden="true"></span>
    <div class="bar__room">
      <span class="bar__name">{{ room().name }}</span>
      <span class="bar__meta"
        ><span class="pulse"></span>{{ onlineCount() }} online · code
        <strong>{{ room().code }}</strong></span
      >
    </div>
    <span class="bar__spacer"></span>
    <div class="bar__timer" role="timer" aria-label="Time left" [attr.data-phase]="timerPhase()">
      <app-icon [name]="clockIcon" [size]="16" />{{ timer() }}
    </div>
    @if (canAddStory()) {
      <button
        class="btn"
        type="button"
        [attr.data-tour]="targets.AddStory"
        (click)="addStory.emit()"
      >
        <app-icon [name]="plusIcon" [size]="16" />Add story
      </button>
    }
    <button
      class="btn btn--primary"
      type="button"
      [attr.data-tour]="targets.Invite"
      (click)="invite.emit()"
    >
      <app-icon [name]="linkIcon" [size]="16" />Invite
    </button>
    <app-theme-toggle />
    <button
      class="btn btn--icon"
      type="button"
      aria-label="Take the room tour"
      title="Take the room tour"
      [attr.data-tour]="targets.TourButton"
      (click)="tourStart.emit()"
    >
      <app-icon [name]="helpIcon" [size]="18" />
    </button>
    @if (me(); as person) {
      <app-avatar
        [name]="person.displayName"
        [colourIndex]="person.colourIndex"
        [animal]="person.avatar"
        [isMe]="true"
      />
    }
  </div>
</header>
