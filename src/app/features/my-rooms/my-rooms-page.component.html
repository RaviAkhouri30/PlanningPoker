<header class="top">
  <app-logo />
  <div class="top__end">
    <app-theme-toggle />
    <a class="btn btn--dark" routerLink="/" fragment="start"
      ><app-icon [name]="plusIcon" [size]="18" />New room</a
    >
  </div>
</header>
<main class="page">
  <div class="page__head">
    <span class="eyebrow">My rooms</span>
    <h1 class="page__title">{{ model.title() }}</h1>
    <p class="page__lead">Pick up where you left off, or start a new room for the next session.</p>
  </div>
  <app-browser-data-notice />
  @if (model.cards().length > 0) {
    <div class="list-head">
      <h2 class="list-head__title">{{ model.cards().length }} {{ model.countLabel() }}</h2>
      <button class="btn" type="button" [disabled]="model.backingUp()" (click)="model.backUpAll()">
        <app-icon [name]="downloadIcon" [size]="18" />Back up all as CSV
      </button>
    </div>
    <app-saved-room-list
      [rooms]="model.cards()"
      [busy]="model.backingUp()"
      (forgetRoom)="model.forget($event)"
      (backupRoom)="model.backUp($event)"
    />
  } @else {
    <div class="empty">
      <h2 class="empty__title">No rooms yet</h2>
      <p class="empty__text">Rooms you create or join in this browser show up here.</p>
      <a class="btn btn--primary" routerLink="/" fragment="start">Start a room</a>
    </div>
  }
</main>
