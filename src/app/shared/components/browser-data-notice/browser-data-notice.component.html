<aside class="notice" aria-label="Saved in this browser">
  <app-icon class="notice__icon" [name]="alertIcon" [size]="20" />
  <p class="notice__text">
    <strong>Saved in this browser only.</strong> Your guest name, your rooms and your moderator
    rights live here. Clearing browser data, a private window or another browser starts you as a new
    guest; the rooms stay, but this list and moderator rights don’t come back.
  </p>
</aside>
