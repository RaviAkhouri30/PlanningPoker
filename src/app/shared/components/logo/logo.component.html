<a class="logo" [class.logo--compact]="compact()" routerLink="/" aria-label="Ante home">

    <rect
      class="logo__back"
      x="3"
      y="5"
      width="14"
      height="19"
      rx="3.5"
      transform="rotate(-12 10 14)"
    />
    <rect
      class="logo__front"
      x="11"
      y="4"
      width="14"
      height="19"
      rx="3.5"
      transform="rotate(8 18 13)"
    />

  <span class="logo__word">Ante</span>
