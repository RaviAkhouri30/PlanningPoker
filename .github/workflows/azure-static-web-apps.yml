name: Azure Static Web Apps CI/CD

# Needs the FIREBASE_* repository secrets and the Static Web App's deployment token, which Azure
# stored as AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_POND_019AB0610 when the app (brave-pond-019ab0610)
# was created. Azure's own generated workflow was removed: its Oryx build has a Node version that
# Angular 22 rejects, and it doesn't write runtime-config.js. This file is the only deploy.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      # Build on the runner instead of inside the SWA action: its Oryx image ships an older Node,
      # which the Angular 22 CLI rejects (needs ^22.22.3 || ^24.15.0 || >=26.0.0).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The Firestore and Auth emulators behind the rules tests run on Java.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore rules tests
        run: npm run test:rules
      - name: Build
        run: npm run build
      # Built here for the same reason as the site, then pruned, so only what runs gets deployed.
      - name: Test and build the functions
        working-directory: api
        run: |
          npm ci
          npm run test:coverage
          npm run build
          npm prune --omit=dev
      # The Firebase web config is public by design but kept out of git (CLAUDE.md §10); the
      # script fails the job if any secret is missing, so a broken config never deploys.
      - name: Write runtime config
        run: node scripts/write-runtime-config.mjs dist/planning-poker/browser/runtime-config.js
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_POND_019AB0610 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          skip_app_build: true
          app_location: 'dist/planning-poker/browser'
          api_location: 'api'
          skip_api_build: true
          output_location: ''

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_POND_019AB0610 }}
          action: 'close'
